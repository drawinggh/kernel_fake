name: scan-what-changed

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch name to scan (required, the branch your kernel is built from)"
        required: true
        type: string
      commits_back:
        description: "Compare against this many commits back (default 10)"
        required: false
        default: "10"
        type: string

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          path: src
          fetch-depth: 40
          persist-credentials: false

      - name: Scan
        shell: bash {0}
        env:
          BACK: ${{ inputs.commits_back }}
        run: |
          export TZ=UTC LC_ALL=C
          mkdir -p report
          OUT="$PWD/report/scan4.txt"
          cd src || exit 0

          case "$BACK" in ''|*[!0-9]*) BACK=10 ;; esac
          [ "$BACK" -gt 35 ] && BACK=35

          DT=arch/arm64/boot/dts/vendor/qcom
          CAS=drivers/power/supply/qcom_cas
          PROFILES="$DT/fg-gen4-batterydata-apollo-sun-5000mah.dtsi $DT/fg-gen4-batterydata-alioth-sun-5000mah.dtsi $DT/fg-gen4-batterydata-alioth-FMT-4520mah.dtsi $DT/fg-gen4-batterydata-alioth-GY-4520mah.dtsi"
          MAIN="$DT/alioth-sm8250.dtsi"
          FILES="$PROFILES $MAIN $CAS/step-chg-jeita.c $CAS/step-chg-jeita.h"

          sec() { echo; echo "## $1"; }

          {
            echo "# what changed scan"
            echo "time_utc: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "commit: $(git rev-parse --short HEAD 2>/dev/null)"
            echo "commits_available: $(git rev-list --count HEAD 2>/dev/null)"

            sec "1. Workflow files and step order (names only)"
            if [ -d .github/workflows ]; then
              for w in .github/workflows/*.y*ml; do
                [ -f "$w" ] || continue
                echo "--- $(basename "$w")"
                grep -nE "^\s*-?\s*name:|uses:|working-directory|KERNEL_DIR" "$w" | cut -c1-110 | head -n 45
              done
            else
              echo "(no workflows dir on this branch)"
            fi

            sec "2. Lines that fetch or copy other code (targets masked)"
            if [ -d .github/workflows ]; then
              grep -nE "git clone|git fetch|git checkout|rsync|cp -[a-zA-Z]*r|repository:|ref:|curl |wget |git pull|git merge|git apply|patch -p|sed -i" .github/workflows/*.y*ml 2>/dev/null \
                | sed -E 's#(repository:|clone|fetch|pull|curl|wget)[^|;&]*#\1 <masked>#' | cut -c1-140 | head -n 40
            fi

            sec "3. Patch markers present in source"
            grep -n "MYBUILD" $CAS/step-chg-jeita.c 2>/dev/null | cut -c1-140
            grep -nE "hysteresis *= *(5|20|40);" $CAS/step-chg-jeita.c 2>/dev/null | cut -c1-120
            grep -n "jeita_warm_th - " $CAS/step-chg-jeita.c 2>/dev/null | cut -c1-140

            sec "4. Commit history of the important files (UTC, no author)"
            git log -n 15 --date=format-local:%Y-%m-%d_%H:%M --format='%h %ad %s' -- $FILES 2>/dev/null | cut -c1-110

            sec "5. Changed lines in the important files (last $BACK commits)"
            if git rev-parse "HEAD~$BACK" >/dev/null 2>&1; then
              git diff "HEAD~$BACK" HEAD -U0 --no-color -- $FILES 2>/dev/null \
                | grep -vE "^(index |diff --git|@@ )" | cut -c1-150 | head -n 160
            else
              echo "(not enough history for HEAD~$BACK)"
            fi

            sec "6. Battery profiles: jeita tables and thresholds (current)"
            for f in $PROFILES; do
              echo "--- $(basename "$f")"
              [ -f "$f" ] || { echo "(missing)"; continue; }
              awk '/qcom,jeita-(fcc|fv)-ranges/{p=1} p{print} p&&/>;/{p=0}' "$f" | sed -E 's/^[[:space:]]+/  /' | cut -c1-90
              grep -nE "jeita-too-hot|jeita-too-cold|jeita-warm-th|jeita-cool-th|use-bq-pump|max-voltage-uv" "$f" | cut -c1-90
            done

            sec "7. Main dtsi charger values (current)"
            grep -nE "chg-warm-th|chg-cool-th|battery-warm-th|therm-level-threshold|fv-max-uv|pd-bat-volt-max|pd-bat-curr-max|six-pin-step-chg-params|sw-jeita|step-charging" "$MAIN" 2>/dev/null | cut -c1-110
            awk '/six-pin-step-chg-params/{p=1} p{print} p&&/;/{p=0}' "$MAIN" 2>/dev/null | cut -c1-80

            sec "8. Kernel: how too-hot and warm are applied"
            grep -nE "jeita_hot_th|jeita_cold_th" $CAS/step-chg-jeita.c 2>/dev/null | cut -c1-130 | head -n 14
            grep -nE "BATT_(WARM|COOL)_THRESHOLD" $CAS/step-chg-jeita.h 2>/dev/null
            grep -nE "BAT_TEMP_TOO_HOT|BAT_TEMP_COLD" $CAS/smb5-lib.h 2>/dev/null
            grep -nE "chg_warm_threshold|chg_cool_threshold" $CAS/smb5-lib.c $CAS/qpnp-smb5.c 2>/dev/null | cut -c1-130 | head -n 14

            sec "9. Overrides: same property defined in more than one place"
            grep -rnE "jeita-fcc-ranges|jeita-warm-th|chg-warm-th" arch/arm64/boot/dts/vendor/qcom/*alioth* arch/arm64/boot/dts/vendor/qcom/*xiaomi* 2>/dev/null \
              | sed -E 's#^arch/arm64/boot/dts/vendor/qcom/##' | cut -c1-110 | head -n 20

            echo; echo "# end"
          } > "$OUT" 2>&1

          sed -E -i 's#https?://[^ )"]+#<url>#g; s#[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+#<email>#g' "$OUT"
          head -c 60000 "$OUT" > "$OUT.tmp" && mv "$OUT.tmp" "$OUT"
          echo "lines: $(wc -l < "$OUT")"
          exit 0

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: scan4-report
          path: report/scan4.txt
          retention-days: 7
          if-no-files-found: error
