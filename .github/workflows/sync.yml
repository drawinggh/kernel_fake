name: Sync Fork (Keep My Changes)

on:
  workflow_dispatch:
    inputs:
      branch_name:
        description: 'Branch to sync (e.g. main, master, dev)'
        required: true
        default: 'main'
      upstream_repo:
        description: 'Upstream repo URL (e.g. https://github.com/owner/repo.git)'
        required: true
        default: ''
      upstream_branch:
        description: 'Upstream branch name'
        required: true
        default: 'main'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch_name }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream ${{ github.event.inputs.upstream_repo }}
          git remote -v

      - name: Fetch upstream
        run: |
          git fetch upstream ${{ github.event.inputs.upstream_branch }}

      - name: Merge upstream with "ours" strategy (keep my changes)
        run: |
          git merge upstream/${{ github.event.inputs.upstream_branch }} \
            --allow-unrelated-histories \
            --no-edit \
            -X ours || true

          if [ -n "$(git ls-files -u)" ]; then
            echo "Unresolved conflicts detected, forcing ours strategy"
            git checkout --ours .
            git add -A
            git commit -m "Auto-resolve conflicts: keep local changes" || true
          fi

      - name: Push changes back
        run: |
          git push origin ${{ github.event.inputs.branch_name }}
